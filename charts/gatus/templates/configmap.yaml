{{ if not .Values.externalConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "names.configMap" . }}
  namespace: {{ include "names.namespace" . }}
  labels:
    {{- include "labels.baseLabels" . | nindent 4 }}
{{- if .Values.config.immutable }}
immutable: {{ .Values.config.immutable }}
{{- end }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{ end }}
